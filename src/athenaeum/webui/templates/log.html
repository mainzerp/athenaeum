{% extends "base.html" %}
{% block title %}Log - Athenaeum{% endblock %}
{% block content %}
<div class="page-header">
  <h1>Library log</h1>
  <p class="subtitle">Contents of log.md, refreshed every 5 seconds.</p>
</div>
<div class="console-output"
     hx-get="/library/log/content"
     hx-trigger="load, every 5s"
     hx-swap="innerHTML">
  <div class="skeleton skeleton-text"></div>
  <div class="skeleton skeleton-text"></div>
  <div class="skeleton skeleton-text" style="width: 60%;"></div>
</div>
{% endblock %}

{% extends "base.html" %}
{% block title %}Diff {{ short }} - Athenaeum{% endblock %}
{% block content %}
<div class="page-header">
  <p class="mb-2"><a href="/library/tree">Back to Library</a></p>
  <h1>Commit {{ short }}</h1>
  <p class="subtitle">{{ subject }}</p>
</div>
{% if diff %}
<div class="card">
  <div class="card-body">
    <pre class="diff">{{ diff }}</pre>
  </div>
</div>
{% else %}
<div class="card">
  <div class="card-body">
    <p class="muted">No changes recorded for this commit.</p>
  </div>
</div>
{% endif %}
{% endblock %}

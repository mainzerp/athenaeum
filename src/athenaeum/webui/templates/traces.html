{% extends "base.html" %}
{% block title %}Traces - Athenaeum{% endblock %}
{% block content %}
<div class="page-header">
  <h1>Traces</h1>
  <p class="subtitle">Per-request librarian traces, refreshed every 5 seconds.</p>
</div>
<div hx-get="/library/traces/rows"
     hx-trigger="load, every 5s"
     hx-swap="innerHTML">
  <div class="skeleton skeleton-text"></div>
  <div class="skeleton skeleton-text"></div>
  <div class="skeleton skeleton-text" style="width: 60%;"></div>
</div>
{% endblock %}

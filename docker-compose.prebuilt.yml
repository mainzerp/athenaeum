# Prebuilt deployment: pulls the GHCR image published by
# .github/workflows/ci.yml instead of building locally. Same runtime
# contract as docker-compose.yml — secrets come from a local .env file or the
# shell, never from the image or this file.
# Pin a release with ATHENAEUM_IMAGE_TAG (e.g. ATHENAEUM_IMAGE_TAG=0.20.0).
services:
  athenaeum:
    image: ghcr.io/mainzerp/athenaeum:${ATHENAEUM_IMAGE_TAG:-latest}
    ports:
      - "8000:8000"
    environment:
      ATHENAEUM_DATA_ROOT: /data
      ATHENAEUM_HOST: 0.0.0.0
      ATHENAEUM_PORT: "8000"
      ATHENAEUM_SECRET_KEY: ${ATHENAEUM_SECRET_KEY:?set in .env or shell}
      ATHENAEUM_LOG_LEVEL: ${ATHENAEUM_LOG_LEVEL:-INFO}
      # optional first-run pre-seed (ignored once a user exists):
      # ATHENAEUM_BOOTSTRAP_ADMIN_USERNAME: ${ATHENAEUM_BOOTSTRAP_ADMIN_USERNAME:-}
      # ATHENAEUM_BOOTSTRAP_ADMIN_PASSWORD: ${ATHENAEUM_BOOTSTRAP_ADMIN_PASSWORD:-}
    volumes:
      - athenaeum-data:/data # named volume; a bind mount (./data:/data) is a documented alternative
    # Hardening: all runtime writes stay under the /data volume (app.db,
    # libraries, embedding models); the rootfs and everything else is read-only.
    read_only: true
    tmpfs:
      - /tmp:size=64m # multipart spool (512 MiB import), Python tempfile, git scratch
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G # headroom for onnxruntime local embeddings
          pids: 256 # canonical form of the legacy pids_limit alias
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    restart: unless-stopped

volumes:
  athenaeum-data:

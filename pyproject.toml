[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "athenaeum"
version = "0.26.0"
description = "Self-hosted, LLM-maintained personal knowledge base (OKF v0.2) with MCP server and WebUI"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "fastmcp>=3.4,<4",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.2",
    "pyyaml>=6.0",
    "argon2-cffi>=23.1",
    "cryptography>=43",
    "httpx>=0.27",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "markdown-it-py>=4.2",
    "mdit-py-plugins>=0.6",
    "Pygments>=2.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "respx>=0.21",
]
# Local (ONNX) embeddings via fastembed — optional for pip installs, included
# in the Docker image. Apache-2.0 (verified upstream LICENSE + wheel, 0.12.0).
local = [
    "fastembed>=0.8.0,<0.9",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
# Jinja2 templates and static assets ship inside the wheel (Docker image).
athenaeum = ["webui/templates/*.html", "webui/static/*"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
